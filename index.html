<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMRAAN FM</title>
  <meta name="description" content="A tiny internet radio experience dedicated to Emraan Hashmi songs.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="brand">EMRAAN <span>FM</span></div>
      <div class="status" id="status">OFF AIR</div>
      <h1>Only Emraan.</h1>
      <p>No search. No playlist browsing. Just press play and let the radio decide.</p>
    </section>

    <section class="player-card">
      <div class="art" id="art">
        <div class="film-strip"></div>
        <div class="initials">EH</div>
      </div>
      <div class="info">
        <div class="eyebrow">NOW PLAYING</div>
        <h2 id="title">Ready when you are</h2>
        <p id="movie">Emraan Hashmi Radio</p>
        <div class="progress"><div id="progressBar"></div></div>
        <div class="time"><span id="elapsed">0:00</span><span id="duration">--:--</span></div>
      </div>
    </section>

    <section class="controls">
      <button class="round" id="back" aria-label="Previous song">↶</button>
      <button class="play" id="play" aria-label="Play">▶</button>
      <button class="round" id="next" aria-label="Next song">↷</button>
    </section>

    <section class="next">
      <div>
        <span class="eyebrow">UP NEXT</span>
        <strong id="nextTitle">Zara Sa</strong>
      </div>
      <div class="radio-dot"></div>
    </section>

    <div id="player" class="youtube-player"></div>

    <footer>
      <span>EMRAAN FM · fan-made concept</span>
      <span>Music is played through YouTube</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
